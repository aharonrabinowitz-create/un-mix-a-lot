<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un-Mix-a-Lot</title>
<style>
html,body{margin:0;height:100%;background:#0b0f19;color:#e5e7eb;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{width:200px;height:200px;display:block}
.n{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:.2px}
#m{opacity:.7;font-size:14px;margin:10px 0 16px;transition:opacity .3s}
.b{width:220px;height:4px;background:#1f2937;border-radius:4px;overflow:hidden;position:relative}
.b i{position:absolute;top:0;bottom:0;left:-35%;width:35%;background:#f59e0b;border-radius:4px;
  animation:sw 1.6s ease-in-out infinite}
.b.done i{animation:none;left:0;width:100%;transition:width .5s ease}
@keyframes sw{to{left:100%}}
@media (prefers-reduced-motion:reduce){.b i{animation:none;left:0;width:100%}}
</style>
<body>
<svg viewBox="0 0 200 200" aria-label="Un-Mix-a-Lot"><g id="g" transform="translate(0 -2)"></g></svg>
<div class="n">Un-Mix-a-Lot</div>
<div id="m">Starting… the first launch can take up to a minute.</div>
<div class="b" id="bar"><i></i></div>
<script>
(function(){
var O='#f59e0b',P='#a855f7',B='#3b82f6',W='#f3f4f6',RS=[24,46,68],COL=[O,P,B],NS='http://www.w3.org/2000/svg';
var g=document.getElementById('g');
function clamp(x){return Math.min(1,Math.max(0,x))}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function seg(t,a,b){return ease(clamp((t-a)/(b-a)))}
function lerp(a,b,t){return a+(b-a)*t}
function hex(c){return [1,3,5].map(function(i){return parseInt(c.slice(i,i+2),16)})}
function mix(a,b,t){var A=hex(a),C=hex(b);return '#'+A.map(function(v,i){return Math.round(lerp(v,C[i],t)).toString(16).padStart(2,'0')}).join('')}
function el(tag,at){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);g.appendChild(e);return e}
function ln(e,x,y1,y2,w,c,o){e.setAttribute('x1',x);e.setAttribute('x2',x);e.setAttribute('y1',y1);e.setAttribute('y2',y2);e.setAttribute('stroke-width',w);e.setAttribute('stroke',c);e.setAttribute('opacity',o)}
function arc(e,p,c){e.setAttribute('stroke',c);e.setAttribute('stroke-dashoffset',1-p);e.setAttribute('opacity',p>0.001?1:0)}
function mkArc(r,s){return el('path',{d:s<0?'M'+(100-r)+' 100 A'+r+' '+r+' 0 0 0 100 '+(100+r):'M'+(100+r)+' 100 A'+r+' '+r+' 0 0 1 100 '+(100+r),fill:'none','stroke-width':12,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1',opacity:0})}
var arcs=[];RS.forEach(function(r,i){[-1,1].forEach(function(s){arcs.push({i:i,e:mkArc(r,s)})})});
var bars=[];for(var k=-6;k<=6;k++)bars.push({k:k,e:el('line',{'stroke-linecap':'round',opacity:0})});
function wave(k,t){var env=.35+.65*Math.exp(-k*k/30),s=Math.sin(t*4.4+k*.9)*Math.sin(t*2.3-k*.5+1);return Math.min(64,8+56*env*(.2+.8*Math.abs(s)))}
// r = seconds since the app became ready (null while still loading: the waveform just keeps dancing)
function draw(t,r){
  var rr=r===null?-1:r, q=seg(rr,0,.55), od=seg(rr,.55,1.0);
  bars.forEach(function(b){
    var k=b.k,x0=100+11*k,ak=Math.abs(k),w0=wave(k,t),h,w=6,op,c=W,x=x0;
    if(k===0){h=lerp(w0,64,q);w=lerp(6,12,q);op=1}
    else if(ak%2===0){var idx=ak/2-1,f=seg(rr,.6+.1*idx,1.3+.1*idx);
      h=lerp(lerp(w0,14,q),64,f);w=lerp(6,12,f);op=lerp(lerp(1,.15,q),1,f);c=mix(W,COL[idx],f);x=lerp(x0,100+(k<0?-1:1)*RS[idx],f)}
    else{h=lerp(w0,14,q);op=lerp(1,.15,q)*(1-od)}
    ln(b.e,x,68-h/2,68+h/2,w,c,op)});
  arcs.forEach(function(a){arc(a.e,seg(rr,1.4+.1*a.i,2.0+.1*a.i),COL[a.i])})
}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var start=performance.now(),rStart=null,msg=document.getElementById('m'),bar=document.getElementById('bar');
function frame(now){draw((now-start)/1000,rStart===null?null:(now-rStart)/1000);requestAnimationFrame(frame)}
// The animation plays on its own timer while the app loads: waveform for WAVE ms, then the U forms over FORM ms
// and holds. The launcher only waits if the app is ready before the animation has finished.
var WAVE=1300,FORM=2200,HOLD=300;
if(reduce){draw(0,99)}
else{requestAnimationFrame(frame);setTimeout(function(){rStart=performance.now()},WAVE)}
// Called by the launcher when the app is ready. Returns how many ms it should still wait before swapping pages.
window.resolveLogo=function(){
  msg.textContent='Ready';bar.className='b done';
  if(reduce)return 0;
  var end=start+WAVE+FORM+HOLD;
  return Math.max(0,Math.round(end-performance.now()));
};
window.__draw=draw; // test hook
})();
</script>
</body>
